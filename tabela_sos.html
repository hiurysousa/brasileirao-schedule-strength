<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão SOS 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9f9f7; color: #1a1a1a; padding: 2rem; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .header { margin-bottom: 1.5rem; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header p { font-size: 13px; color: #888; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #e8e8e4; }
  thead tr { border-bottom: 1px solid #e8e8e4; }
  thead th { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.06em; padding: 12px 14px; text-align: left; }
  th.sos-col, td.sos-col { text-align: center; width: 140px; }
  tbody tr { border-bottom: 1px solid #f0f0ec; transition: background 0.1s; }
  tbody tr:hover { background: #f9f9f7; }
  tbody tr:last-child { border-bottom: none; }
  td { padding: 11px 14px; font-size: 13px; vertical-align: middle; }
  .rank { color: #bbb; font-size: 12px; width: 32px; }
  .team-name { font-weight: 600; }
  .sos-bar-wrap { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .sos-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }
  .bar-bg { flex: 1; height: 4px; background: #ececec; border-radius: 2px; max-width: 52px; }
  .bar-fill { height: 4px; border-radius: 2px; }
  .seq { font-size: 12px; color: #666; }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin: 1px; }
  .badge-c { background: #eaf3de; color: #3b6d11; }
  .badge-f { background: #f1f0ee; color: #888; }
  .legend { display: flex; gap: 16px; margin-top: 1rem; font-size: 12px; color: #888; align-items: center; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Força de sequência — Brasileirão 2026</h1>
    <p>SOS ponderado pelos próximos 5 jogos · Adversário em casa = peso 1.2 · Adversário fora = peso 0.8</p>
  </div>
  <table>
    <thead>
      <tr>
        <th style="width:32px"></th>
        <th>Time</th>
        <th class="sos-col">SOS</th>
        <th>Sequência</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="legend">
    <span><span class="legend-dot" style="background:#A32D2D"></span>Sequência difícil</span>
    <span><span class="legend-dot" style="background:#BA7517"></span>Sequência média</span>
    <span><span class="legend-dot" style="background:#3B6D11"></span>Sequência fácil</span>
    <span style="margin-left:8px"><span class="badge badge-c">C</span> Casa</span>
    <span><span class="badge badge-f">F</span> Fora</span>
  </div>
</div>

<script>
const data = [
  { time: "Coritiba",      sos: 0.5397, seq: [["SAN","F"],["BAH","C"],["FLA","F"],["PAL","C"],["CRU","C"]] },
  { time: "Chapecoense",   sos: 0.5356, seq: [["REM","C"],["CRU","F"],["PAL","F"],["FLA","C"],["SAN","F"]] },
  { time: "São Paulo",     sos: 0.5298, seq: [["FLU","F"],["BOT","C"],["REM","F"],["CAP","C"],["FLA","F"]] },
  { time: "Atlético-MG",   sos: 0.5173, seq: [["VAS","C"],["FLA","F"],["PAL","C"],["FLU","F"],["BOT","C"]] },
  { time: "Internacional", sos: 0.4842, seq: [["BOT","F"],["PAL","C"],["FLU","F"],["FLA","C"],["COR","F"]] },
  { time: "Botafogo",      sos: 0.4830, seq: [["INT","C"],["SAO","F"],["CAM","F"],["GRE","C"],["VIT","F"]] },
  { time: "Mirassol",      sos: 0.4818, seq: [["COR","F"],["GRE","C"],["FLU","F"],["VAS","C"],["CAP","F"]] },
  { time: "Cruzeiro",      sos: 0.4762, seq: [["GRE","F"],["CHA","C"],["FLU","C"],["CAP","F"],["CFC","F"]] },
  { time: "Flamengo",      sos: 0.4514, seq: [["CAP","F"],["PAL","C"],["CFC","C"],["CHA","F"],["SAO","F"]] },
  { time: "Palmeiras",     sos: 0.4439, seq: [["RBB","C"],["FLA","F"],["INT","F"],["CAM","F"],["CAP","C"]] },
  { time: "Fluminense",    sos: 0.4354, seq: [["SAO","C"],["RBB","F"],["CRU","F"],["CAM","C"],["INT","C"]] },
  { time: "Corinthians",   sos: 0.4259, seq: [["MIR","C"],["VAS","F"],["REM","C"],["BAH","F"],["INT","C"]] },
  { time: "Grêmio",        sos: 0.4240, seq: [["CRU","C"],["MIR","F"],["BOT","F"],["SAO","C"],["VIT","C"]] },
  { time: "Athletico-PR",  sos: 0.4198, seq: [["FLA","C"],["VIT","F"],["SAO","F"],["PAL","F"],["BAH","C"]] },
  { time: "Vitória",       sos: 0.4160, seq: [["CAP","C"],["RBB","F"],["BOT","C"],["GRE","F"],["FLU","C"]] },
  { time: "Bahia",         sos: 0.3957, seq: [["CFC","F"],["REM","C"],["VAS","F"],["COR","C"],["CAP","F"]] },
  { time: "Remo",          sos: 0.3869, seq: [["CHA","F"],["BAH","F"],["COR","F"],["SAO","C"],["CHA","C"]] },
  { time: "Bragantino",    sos: 0.3746, seq: [["PAL","F"],["VIT","C"],["FLU","C"],["VAS","F"],["MIR","C"]] },
  { time: "Santos",        sos: 0.3713, seq: [["CFC","C"],["FLA","F"],["MIR","C"],["RBB","F"],["CHA","C"]] },
  { time: "Vasco",         sos: 0.3695, seq: [["CAM","F"],["COR","C"],["BAH","C"],["MIR","F"],["RBB","C"]] },
];

const maxSos = Math.max(...data.map(d => d.sos));
const minSos = Math.min(...data.map(d => d.sos));

function getColor(sos) {
  const norm = (sos - minSos) / (maxSos - minSos);
  if (norm > 0.66) return '#A32D2D';
  if (norm > 0.33) return '#BA7517';
  return '#3B6D11';
}

const tbody = document.getElementById('tbody');
data.forEach((d, i) => {
  const color = getColor(d.sos);
  const norm = (d.sos - minSos) / (maxSos - minSos);
  const pct = Math.round(norm * 100);
  const seqHtml = d.seq.map(([sigla, mando]) =>
    `<span class="badge badge-${mando.toLowerCase()}">${sigla} (${mando})</span>`
  ).join(' ');
  tbody.innerHTML += `
    <tr>
      <td class="rank">${i + 1}</td>
      <td><span class="team-name">${d.time}</span></td>
      <td class="sos-col">
        <div class="sos-bar-wrap">
          <span class="sos-val" style="color:${color}">${d.sos.toFixed(4)}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
        </div>
      </td>
      <td class="seq">${seqHtml}</td>
    </tr>`;
});
</script>
</body>
</html>
