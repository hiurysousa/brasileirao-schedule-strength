name: Atualizar dados do Brasileirão

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-brasileirao
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Verificar cálculo
        run: python -m unittest discover -s tests -v
      - name: Consultar ESPN
        run: python -m schedule_strength
      - name: Publicar snapshot no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar snapshot do Brasileirão"
            git push
          fi
